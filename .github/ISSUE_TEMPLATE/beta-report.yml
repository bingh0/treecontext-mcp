name: Beta report
description: Something broke, or the agent didn't remember what it should have
labels: [beta]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing. The most useful reports say what you expected
        the agent to remember and what it actually did.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Agent
      options:
        - Claude Code (CLI)
        - Claude Code (VS Code extension)
        - GitHub Copilot (VS Code)
        - Other
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Linux, macOS, Windows]
    validations:
      required: true

  - type: textarea
    id: doctor
    attributes:
      label: treecontext doctor
      description: Output of `treecontext doctor`.
      render: text
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs (optional)
      description: |
        Output of `treecontext doctor --dump-logs`. **Redact anything
        sensitive first** — it can contain fragments of your session.
      render: text

  - type: checkboxes
    id: basics
    attributes:
      label: Before filing
      options:
        - label: I restarted the agent after running `treecontext install`
        - label: I checked `treecontext doctor` for a `fix:` line
